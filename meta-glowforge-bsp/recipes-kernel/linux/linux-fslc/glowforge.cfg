# One core. The i.MX6 Solo has a single Cortex-A9, so the SMP kernel's
# spinlocks, IPIs and per-CPU machinery buy nothing. The TWD stays the tick
# and the GPT the clocksource, as before.
# CONFIG_SMP is not set

# Boot and power features with no use on a mains-powered laser: no ATAGs on a
# device-tree boot, no suspend (which also hides kexec and the crash kernel;
# pstore is the crash record), no swap, no initrd formats beyond gzip, and no
# high memory (512 MB fits below the 3G/1G split). The CPU runs at its full
# 996 MHz always (performance is the only governor): a single core with a
# SCHED_FIFO step producer gains nothing from idling at 396 MHz and waiting
# for ondemand's sampling to notice a job, and the SoC sits at half its
# passive trip point at full clock.
# CONFIG_ATAGS is not set
# CONFIG_SUSPEND is not set
# CONFIG_PM_DEBUG is not set
# CONFIG_SWAP is not set
# CONFIG_HIGHMEM is not set
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
# CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND is not set
# CONFIG_CPU_FREQ_GOV_ONDEMAND is not set
# CONFIG_CPU_FREQ_GOV_CONSERVATIVE is not set
# CONFIG_CPU_FREQ_GOV_POWERSAVE is not set
# CONFIG_CPU_FREQ_GOV_USERSPACE is not set
# CONFIG_IOSCHED_BFQ is not set
# CONFIG_MQ_IOSCHED_KYBER is not set
# CONFIG_CONNECTOR is not set
# CONFIG_RD_BZIP2 is not set
# CONFIG_RD_LZ4 is not set
# CONFIG_RD_LZMA is not set
# CONFIG_RD_LZO is not set
# CONFIG_RD_XZ is not set
# CONFIG_RD_ZSTD is not set

# /dev/mem reaches MMIO only (the bench pad readers need nothing else);
# DRAM, the SDMA context RAM and OCOTP are out of a root process's reach.
CONFIG_STRICT_DEVMEM=y
# CONFIG_IO_STRICT_DEVMEM is not set
