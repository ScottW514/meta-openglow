# ForgeFIRM kernel config fragment: the Glowforge board on linux-fslc 6.12 (mainline).
#
# Merged on top of imx_v6_v7_defconfig. That defconfig targets every i.MX6/7
# board NXP ever shipped; this fragment turns the result into the kernel for
# one board: an i.MX6 Solo with UART, eCSPI2 (the PIC), I2C1/2/4, three uSDHC
# ports (WL1805 SDIO, SD, eMMC), PWM1/2/4, EPIT1/2, SDMA, MIPI CSI-2 into the
# IPU, the VPU, the GPU, CAAM, OCOTP, the SNVS RTC, WDOG1, and the glowforge
# nodes. Two sections: what the board needs turned on, then what the defconfig
# turns on that the board has no hardware or consumer for.
#
# Every line here is expected to survive the merge as written. After a build,
# diff this file against the kernel's .config; a line that did not land means a
# parent symbol is missing, not that the option is optional.

# ============================================================================
# Needed
# ============================================================================

# i.MX6 SDMA underpins the factory step-stream playback ForgeFIRM reuses. The
# engine runs on its ROM scripts: the driver is built in and probes before the
# rootfs exists, so the RAM firmware is never requested successfully, and no
# client on this board needs a RAM script (the pulse script is loaded by
# glowforge.ko itself). The image ships no SDMA firmware for that reason.
CONFIG_IMX_SDMA=y

# Full kernel preemption, as the factory kernel ran (imx_v6_v7_defconfig only
# gives PREEMPT_VOLUNTARY). Bounds the wakeup latency of the SCHED_FIFO pulse
# feeder and the softirq hrtimers (ramp updates, safety sampler, HV-watchdog
# feed). PREEMPT_RT is not selectable on arm32 6.12 (no ARCH_SUPPORTS_RT); the
# ring-depth arithmetic that makes RT unnecessary is on the documentation site
# (https://docs.forgefirm.org/technical/forgefirm/image-and-bsp/, "Real time").
CONFIG_PREEMPT=y

# Turn a kernel oops into a panic so the laser-safing panic notifier
# (glowforge.ko: EPIT stop + FIRE parked + charge pump low + steppers
# de-energized) actually runs. Without this a NULL deref in any driver
# mid-cut kills only the offending task and returns, leaving the SDMA+EPIT
# engine clocking FIRE bits out of the ring on a corrupted kernel. A hung task
# and a soft lockup panic on the same reasoning; the two detectors must be on
# for their BOOTPARAM_*_PANIC switches to exist at all. The panic reboots the
# machine after ten seconds whether the boot arguments say so or not
# (PANIC_TIMEOUT; the boot arguments carry panic=10 as well).
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_TIMEOUT=10
CONFIG_DETECT_HUNG_TASK=y
CONFIG_BOOTPARAM_HUNG_TASK_PANIC=y
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y

# Crash record. A panic reboots the machine, so the oops text and the tail of
# the console log are kept in the ramoops region the device tree reserves
# (the 1 MiB at the top of DRAM that the bootloader holds back from the
# memory node) and come back on the next boot under /sys/fs/pstore.
CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y

# U-Boot arms WDOG1 with a 60 s timeout before Linux starts. The i.MX2+
# watchdog driver must therefore be pinned, not inherited from the
# defconfig: without it nothing adopts the running watchdog and every
# boot dies in a 60 s reset loop. With the driver in and /dev/watchdog
# left unopened, the kernel core keeps the boot-armed watchdog fed. It
# is a boot/system watchdog only, never a laser-safety mechanism (the
# fast beam stop is the ring-drain chain; see the kernel module docs).
CONFIG_IMX2_WDT=y
# The watchdog's sysfs view (identity, state, timeout, bootstatus): the
# acceptance check reads that the boot-armed watchdog is active at 60 s,
# and bootstatus says whether the last reset was its timeout. Read-only;
# nothing about the watchdog itself changes.
CONFIG_WATCHDOG_SYSFS=y

# The SDMA pulse ring comes from the dedicated no-map reserved pool
# (cnc_reserved -> memory-region on the cnc node), NOT from CMA. CMA stays
# pinned on for the camera/imx-media path (64 MiB linux,cma node) and as the
# fallback allocator if the dedicated pool ever fails to attach.
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# Motion path: expose EPIT1/EPIT2 to glowforge.ko (arch/arm/mach-imx/epit_api.c).
CONFIG_MXC_EPIT_API=y

# Pinned because the defconfig never names them: it gets them selected by
# symbols this fragment turns off (suspend pulled in PM, ext3 pulled in ext4,
# the USB gadget pulled in nothing we keep). PM carries runtime PM and the
# GPC power domains (the GPU/VPU rail), and the camera sensor drivers depend
# on it. The regulator core carries the fixed rails (12 V, 40 V, WLAN enable,
# camera supplies) and ANATOP (VDDARM for cpufreq). ext4 is the rootfs, /data
# and the factory slots; with ext2 and ext3 off it mounts those formats too.
CONFIG_PM=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_ANATOP=y
CONFIG_ARM_IMX6Q_CPUFREQ=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y

# The ciphers mac80211 asks the crypto API for by name at association time
# (CCMP, GCMP, BIP/CMAC) and SHA-256 for the signed regulatory database.
# Built in, so nothing depends on a module being on the rootfs and found by
# alias: with mac80211 modular they would otherwise all default to modules.
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_CTR=y
CONFIG_CRYPTO_GHASH=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_SHA256=y

# Camera: mainline OV5648 (5 MP) + OV8856 (8 MP, "HD" units) subdevs behind the
# imx6 IPU/MIPI-CSI2 (imx-media) capture path, with a GPIO video-mux modeling
# the factory CAM_SEL MIPI switch (lid/head). Both sensors share the camera@36
# dual-compatible node; whichever matches the chip-id binds.
# MEDIA_SUPPORT_FILTER narrows the media stack to camera + platform drivers;
# without it every media API is on and the whole DVB frontend and tuner tree
# defaults to module. SUBDRV_AUTOSELECT then hides the ancillary drivers.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_SUPPORT_FILTER=y
CONFIG_MEDIA_SUBDRV_AUTOSELECT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_V4L_MEM2MEM_DRIVERS=y
CONFIG_VIDEO_CODA=m
CONFIG_VIDEO_OV5648=m
CONFIG_VIDEO_OV8856=m
# VIDEO_IMX_MEDIA covers the whole 6.12 imx6 capture path (IPU CSI + the
# imx6-mipi-csi2 receiver); the old VIDEO_IMX_CSI / VIDEO_IMX6_MIPI_CSI2
# symbols do not exist on 6.12 and are silently dropped by merge_config.
CONFIG_STAGING_MEDIA=y
CONFIG_VIDEO_IMX_MEDIA=m
CONFIG_VIDEO_MUX=m
# The mux subsystem lands as modules: the GPIO mux is CAM_SEL, the MMIO mux is
# the IPU CSI source select in IOMUXC_GPR. Both bind from the device tree.
CONFIG_MULTIPLEXER=m
CONFIG_MUX_GPIO=m
CONFIG_MUX_MMIO=m

# WiFi: cfg80211/mac80211 as modules (imx_v6_v7_defconfig builds them in).
# Built-in cfg80211 requests regulatory.db before the rootfs is mounted, so
# every boot logs "failed to load regulatory.db" and the database only loads
# on an explicit `iw reg reload`. As modules they load with wlcore (=m),
# after mount, and the direct load succeeds.
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_WLAN_VENDOR_TI=y
CONFIG_WLCORE=m
CONFIG_WLCORE_SDIO=m
CONFIG_WL18XX=m
# Power save default-off: a mains-powered machine gains only latency and
# dropouts from it. (forgectrl also pins it off at startup, which covers
# kernels still carrying the built-in default.)
# CONFIG_CFG80211_DEFAULT_PS is not set
# The doors switch is EV_SW code 3 in the factory switch numbering, which
# collides with the Linux SW_RFKILL_ALL code: with the rfkill-input handler
# built in, every lid-open soft-blocks all radios and drops the WLAN
# mid-session. The switch code is fixed UAPI (the factory DTB and gfhardware
# both use it), so the handler goes instead. Requires CONFIG_EXPERT, which
# imx_v6_v7_defconfig already sets; without it the symbol is forced back on.
# CONFIG_RFKILL_INPUT is not set

